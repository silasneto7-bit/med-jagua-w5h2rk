<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('dados').textContent);
/* rascunho: uma chave por obra (versão 3). Guarda também os endereços (aba + célula) das marcas, para a versão
   seguinte do app, com outra base (zerada ou medição final), aproveitar o que foi marcado. */
var KEY='medcampo3|'+D.obra,MAPA=null;
var st={v:3,base:D.sha1,marks:{},pu:{},cant:{},cantOk:false,tecnico:'',salvoEm:'',med:D.med,hist:[]};
var ui={tela:'quad',quadra:null,lote:null,filtro:'todos',busca:'',aba:0,srv:null,sbusca:'',fechados:{},msgSave:'',enviarMsg:'',pz:0,puAba:null};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function pad(n){return (n<10?'0':'')+n}
function agora(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(n,d){if(n==null||isNaN(n))return '–';return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?2:d})}
function parseNum(s){s=String(s==null?'':s).replace(/\s/g,'');if(!s)return null;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=Number(s);return isNaN(n)?null:n}
function round(n,d){var p=Math.pow(10,d);return Math.round((n+1e-12)*p)/p}
function MED(){return st.med||D.med}
function periodoDe(m){
  var mm=/(\d\d)\/(\d\d)\/(\d{4})/.exec(D.periodo||'');
  if(!mm)return D.periodo||'';
  var d0=new Date(+mm[3],+mm[2]-1+(m-D.med),1),d1=new Date(d0.getFullYear(),d0.getMonth()+1,0);
  return '01/'+pad(d0.getMonth()+1)+'/'+d0.getFullYear()+' a '+pad(d1.getDate())+'/'+pad(d1.getMonth()+1)+'/'+d1.getFullYear();
}

/* ---------- preparo dos dados ---------- */
D.abas.forEach(function(ab){
  ab.groups=[];var cur=null;
  ab.linhas.forEach(function(ln,ri){
    ln.lvl=ln.cod.split('.').filter(Boolean).length;
    if(ln.lvl===1||!cur){cur={ri:ri,cod:ln.lvl===1?ln.cod:'',desc:ln.lvl===1?ln.desc:'',rows:[]};ab.groups.push(cur)}
    ln.g=ab.groups.length-1;
    if(ln.folha)cur.rows.push(ri);
  });
});
var LOTS={};
D.abas.forEach(function(ab,a){
  ab.lotes.forEach(function(lt,i){
    var k=lt.q+lt.n;
    var l=LOTS[k]||(LOTS[k]={key:k,q:lt.q,n:lt.n,houses:[],en:null});
    if(ab.tipo==='energia')l.en={a:a,i:i};else l.houses.push({a:a,i:i});
  });
});
var TEM_EN=D.abas.some(function(ab){return ab.tipo==='energia'});
var QUADRAS=[];
Object.keys(LOTS).forEach(function(k){if(QUADRAS.indexOf(LOTS[k].q)<0)QUADRAS.push(LOTS[k].q)});
QUADRAS.sort();
function lotsDe(q){return Object.keys(LOTS).filter(function(k){return LOTS[k].q===q}).sort(function(x,y){return LOTS[x].n-LOTS[y].n})}
function entradas(l){var r=l.houses.slice();if(l.en)r.push(l.en);return r}
function avisosLote(l){
  var w=[];
  if(!l.houses.length)w.push('Lote só consta na aba de entrada de energia; não há aba de casa para ele.');
  if(l.houses.length>1)w.push('Lote consta em duas abas de casa ('+l.houses.map(function(h){return D.abas[h.a].id+' – '+D.abas[h.a].rot}).join(' e ')+'). Marque só a tipologia que existe de fato.');
  if(!l.en&&TEM_EN)w.push('Lote não tem coluna na aba de entrada de energia.');
  return w;
}
function rotulo(l){return l.q+' '+l.n}
/* textos opcionais da ficha (obra sem quadras: locais com código curto) */
var TX=D.textos||{},T_LOTE=TX.lote||'Lote';
function qT(q){return (TX.quadra_titulo&&TX.quadra_titulo[q])||('Quadra '+q)}
function qN(q){return TX.quadra_titulo&&TX.quadra_titulo[q]?TX.quadra_titulo[q]:''}
function prefAba(ab){var p=ab.tipo==='energia'?'Entrada de energia':(TX.aba_prefixo!=null?TX.aba_prefixo:'Casa');return p?esc(p)+' — ':''}
function uT(p){return p.un==='M2'?'m²':(p.un==='M'?'m':(p.un||'sem un.'))}
var TOTAL_LOTES=Object.keys(LOTS).filter(function(k){return TEM_EN?!!LOTS[k].en:true}).length;
/* locais da tela inicial (planta e grade): planta.botoes da ficha {rotulo,titulo,pos,lotes} ou, sem ela, um por quadra.
   Lote fora de todos os botões entra num local da quadra (sem botão na planta). ui.quadra guarda o id do local. */
var GRUPOS=[],GI={};
(function(){
  var B=(D.planta&&D.planta.botoes)||[],M=(D.planta&&D.planta.marcas)||{},usado={};
  function add(g){if(g.lotes.length){GI[g.id]=g;GRUPOS.push(g)}}
  B.forEach(function(b,i){var ls=(b.lotes||[]).filter(function(k){return !!LOTS[k]});ls.forEach(function(k){usado[k]=1});
    add({id:'b'+i,bt:true,rot:String(b.rotulo||''),nome:b.titulo||'',tit:b.titulo||String(b.rotulo||''),pos:b.pos||null,lotes:ls})});
  QUADRAS.forEach(function(q){add({id:q,rot:q,nome:qN(q),tit:qT(q),pos:B.length?null:(M[q]||null),lotes:lotsDe(q).filter(function(k){return !usado[k]})})});
})();
function lotsG(id){return GI[id]?GI[id].lotes:[]}
/* botão (planta.botoes) com um lote só: abre direto os serviços do lote; voltar leva à tela inicial */
function direto(id){var g=GI[id];return g&&g.bt&&g.lotes.length===1?g.lotes[0]:null}
function grupoDe(k){for(var i=0;i<GRUPOS.length;i++)if(GRUPOS[i].lotes.indexOf(k)>=0)return GRUPOS[i].id;return null}
/* lote único da quadra com nome (textos.quadra_titulo): mostra o nome no lugar de "Nº 1" */
function nomeUnico(l){return lotsDe(l.q).length===1?qN(l.q):''}

/* ---------- rascunho ---------- */
function mapaAtual(){return {abas:D.abas.map(function(ab){return {aba:ab.aba,cols:ab.lotes.map(function(l){return l.col}),rows:ab.linhas.map(function(ln){return ln.r})}}),pu:D.pu.map(function(p){return p.aba+'|'+p.cel})}}
function idxParaEnd(marks,mapa){var bat={};Object.keys(marks||{}).forEach(function(k){var p=k.split('|'),ab=mapa.abas[+p[0]];if(!ab)return;var col=ab.cols[+p[2]],r=ab.rows[+p[1]];if(col==null||r==null)return;(bat[ab.aba]=bat[ab.aba]||[]).push(col+r)});return bat}
function puParaChave(obj,mapa){var r={};Object.keys(obj||{}).forEach(function(i){var k=mapa.pu[+i];if(k)r[k]=obj[i]});return r}
function portatil(o,mapa){return {cel:idxParaEnd(o.marks,mapa),pu:puParaChave(o.pu,mapa),hist:(o.hist||[]).map(function(h){return {med:h.med,cel:idxParaEnd(h.marks,mapa),pu:puParaChave(h.pu,mapa),cant:h.cant||{},cantTotal:h.cantTotal}})}}
function baseV(a,ri,li){var ln=D.abas[a].linhas[ri];return ln.v0?ln.v0[li]:ln.v[li]}
function nomeBase(){return (D.base_tipo==='final'?'medição final ':'zerada da medição ')+(D.med_arquivo||D.med)}
/* aplica as regras de troca de base: medições do app já cobertas pela base saem; marca em célula que a base já
   traz preenchida sai; se a medição atual do rascunho já fechou na base, as marcas dela saem. */
function ajusta(n,perd){
  var sup=[],dm=0,da=0,hist=[],medAnt=n.med;
  function livres(m){var x={};Object.keys(m||{}).forEach(function(k){var p=k.split('|');if(baseV(+p[0],+p[1],+p[2])===null)x[k]=1;else dm++});return x}
  (n.hist||[]).forEach(function(h){if(h.med<D.med){sup.push(h.med);return}h.marks=livres(h.marks);hist.push(h)});
  n.hist=hist;
  if((n.med||D.med)<D.med){da=Object.keys(n.marks||{}).length;n.marks={};n.pu={};n.cant={};n.med=D.med}
  else n.marks=livres(n.marks);
  var cantRev=n.cantOk;n.cantOk=false;n.v=3;n.base=D.sha1;
  var t='App atualizado com a '+nomeBase()+'.';
  if(sup.length)t+=' Medição '+sup.join(', ')+' do app substituída pela planilha.';
  if(da)t+=' '+da+' marca(s) da medição '+medAnt+' saíram: essa medição já fechou.';
  if(dm)t+=' '+dm+' marca(s) saíram: o serviço já consta como medido.';
  if(perd)t+=' '+perd+' marca(s) não reconhecida(s).';
  t+=' Marcas mantidas: '+Object.keys(n.marks).length+'.';
  if(cantRev)t+=' Confira de novo o canteiro.';
  return {st:n,texto:t};
}
function rebase(o){
  var P=o.port;
  if(!P)return {st:{v:3,base:D.sha1,tecnico:o.tecnico||'',salvoEm:'',hist:[],marks:{},pu:{},cant:{},cantOk:false,med:D.med},texto:'App atualizado com a '+nomeBase()+'. O rascunho anterior não pôde ser aproveitado.'};
  var puIdx={};D.pu.forEach(function(p,i){puIdx[p.aba+'|'+p.cel]=i});
  function puDe(m){var r={};Object.keys(m||{}).forEach(function(k){if(puIdx[k]!==undefined)r[puIdx[k]]=m[k]});return r}
  function cantDe(m){var r={};Object.keys(m||{}).forEach(function(l){if(CIT[l])r[l]=m[l]});return r}
  var perd=0,r=marksDe(P.cel);perd+=r.erro;
  var n={v:3,base:o.base,tecnico:o.tecnico||'',salvoEm:'',med:o.med||D.med,marks:r.m,pu:puDe(P.pu),cant:cantDe(o.cant),cantOk:!!o.cantOk,hist:[]};
  (P.hist||[]).forEach(function(h){var rr=marksDe(h.cel);perd+=rr.erro;n.hist.push({med:h.med,marks:rr.m,pu:puDe(h.pu),cant:cantDe(h.cant),cantTotal:h.cantTotal,draft:null})});
  return ajusta(n,perd);
}
function load(){
  var o=null,velho=false;
  try{var s=localStorage.getItem(KEY);if(s)o=JSON.parse(s)}catch(e){o=null}
  if(!o||!o.marks){
    /* rascunho da versão anterior do app (chave antiga, uma por base) */
    o=null;
    var cands=[[D.sha1,null]];Object.keys(D.legado||{}).forEach(function(k){cands.push([D.legado[k].sha1,D.legado[k].mapa])});
    for(var i=0;i<cands.length&&!o;i++){
      try{var s2=localStorage.getItem('medcampo2|'+D.obra+'|'+cands[i][0].slice(0,12));if(!s2)continue;var o2=JSON.parse(s2);if(!o2||!o2.marks)continue;
        o=o2;o.v=3;o.base=cands[i][0];if(cands[i][1])o.port=portatil(o2,cands[i][1]);velho=true}catch(e){o=null}
    }
  }
  if(!o)return;
  if(!o.pu)o.pu={};if(!o.cant)o.cant={};if(!o.hist)o.hist=[];if(!o.med)o.med=D.med;
  if(o.base&&o.base!==D.sha1){var r=rebase(o);st=r.st;st.ultimaTroca={quando:new Date().toLocaleString('pt-BR'),texto:r.texto};ui.avisoBase=r.texto;save()}
  else{st=o;st.v=3;st.base=D.sha1;if(velho)save()}
}
function save(){
  st.salvoEm=agora();
  try{st.port=portatil(st,MAPA)}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(st));ui.msgSave='ok'}catch(e){ui.msgSave='err'}
  var el=$('sv');if(el)paintSave();
}
function paintSave(){var el=$('sv');if(!el)return;if(ui.msgSave==='err'){el.className='err';el.textContent='sem rascunho!'}else{el.className='';el.textContent=st.salvoEm?('salvo '+st.salvoEm):'sem marcas'}}

/* ---------- contagens ---------- */
function mk(a,ri,li){return !!st.marks[a+'|'+ri+'|'+li]}
function contaEntrada(a,li){
  var ab=D.abas[a],t=0,lk=0,m=0;
  ab.linhas.forEach(function(ln,ri){if(!ln.folha)return;t++;if(ln.v[li]!==null)lk++;else if(st.marks[a+'|'+ri+'|'+li])m++});
  return {tot:t,lock:lk,mk:m,pend:t-lk-m};
}
function contaLote(l){
  var r={tot:0,lock:0,mk:0,pend:0};
  entradas(l).forEach(function(e){var c=contaEntrada(e.a,e.i);r.tot+=c.tot;r.lock+=c.lock;r.mk+=c.mk;r.pend+=c.pend});
  return r;
}
function totalMarcas(){return Object.keys(st.marks).length}
function puLinhas(){return D.pu.map(function(p,i){return puCalc(i)}).filter(function(x){return x.ativo})}

/* ---------- navegação ---------- */
function go(tela,o){
  ui.tela=tela;if(o)for(var k in o)ui[k]=o[k];
  render();window.scrollTo(0,0);
}
function topo(t1,t2,voltar){
  $('top').innerHTML=(voltar?'<button class="bk" data-act="back" aria-label="Voltar">‹</button>':'')+
    '<div class="tt"><div class="t1">'+esc(t1)+'</div><div class="t2">'+esc(t2)+'</div></div><div id="sv"></div>';
  paintSave();
}
function navHtml(){
  var t=ui.tela;
  var grupo=(t==='quad'||t==='lotes'||t==='lote')?'lotes':(t==='servicos'?'servicos':((t==='qtd'||t==='cant')?'qtd':'enviar'));
  var n=totalMarcas()+puLinhas().length;
  function b(id,ic,tx){return '<button data-act="nav" data-t="'+id+'" class="'+(grupo===id?'on':'')+'"><b>'+ic+'</b>'+tx+(id==='enviar'&&n?'<span class="bd">'+n+'</span>':'')+'</button>'}
  $('nav').innerHTML=b('lotes','▦','Lotes')+b('servicos','☰','Serviços')+b('qtd','㎡',esc(TX.aba_pu||'Quantidades'))+b('enviar','⇪','Enviar');
}

/* ---------- telas ---------- */
var PLANTA=((document.getElementById('planta')||{}).textContent||'').trim();
var plantaEl=null,ZOOMS=[1,1.7,2.8,4.5];
function plantaNode(){
  if(!plantaEl){
    plantaEl=document.createElement('div');plantaEl.className='pwrap';
    plantaEl.innerHTML='<div class="pin"><img alt="Planta de implantação"><div class="mks"></div></div>';
    plantaEl.querySelector('img').src=PLANTA;
  }
  return plantaEl;
}
function paintPlanta(){
  var n=plantaNode();
  n.querySelector('.pin').style.width=(ZOOMS[ui.pz]*100)+'%';
  var h='';
  GRUPOS.forEach(function(g){
    var m=g.pos;if(!m)return;
    var ls=g.lotes,c=0,mc=0,n=g.rot.length;
    ls.forEach(function(k){var cl=contaLote(LOTS[k]).mk;if(cl>0)c++;mc+=cl});
    h+='<button class="pm'+(n>=5?' lw':(n===4?' l4':(n===3?' l3':'')))+(c===ls.length?' full':(mc?' has':''))+'" style="left:'+(m[0]*100/D.planta.w)+'%;top:'+(m[1]*100/D.planta.h)+'%" data-act="quadra" data-q="'+esc(g.id)+'" aria-label="'+esc(g.tit)+'">'+esc(g.rot)+'</button>';
  });
  n.querySelector('.mks').innerHTML=h;
}
function render(){
  var y=window.scrollY;
  var pr=(plantaEl&&plantaEl.parentNode)?{l:plantaEl.scrollLeft,t:plantaEl.scrollTop}:null;
  var t=ui.tela,h='';
  $('foot').innerHTML='';
  if(t==='quad')h=rQuad();
  else if(t==='lotes')h=rLotes();
  else if(t==='lote')h=rLote();
  else if(t==='servicos')h=rServicos();
  else if(t==='qtd')h=rQtd();
  else if(t==='cant')h=rCant();
  else h=rEnviar();
  $('main').innerHTML=h;
  var slot=$('plslot');
  if(slot){slot.appendChild(plantaNode());paintPlanta();if(pr){plantaEl.scrollLeft=pr.l;plantaEl.scrollTop=pr.t}}
  navHtml();
  if(t==='lote')rodapeLote();
  if(t==='cant')rodapeCant();
}
function cab(){return D.obra+' · Medição '+MED()}
function per(){return periodoDe(MED())}

function rQuad(){
  topo(cab(),per(),false);
  var h='<div class="go"><input class="inp" id="ir" placeholder="Ir direto ao lote (ex.: '+esc(TX.exemplo||'F1')+')" autocapitalize="characters" autocomplete="off" enterkeyhint="go"><button class="btn" data-act="ir">Ir</button></div>';
  if(ui.irErro){h+='<div class="warn">'+esc(ui.irErro)+'</div>';ui.irErro=''}
  if(ui.avisoBase)h+='<div class="warn">'+esc(ui.avisoBase)+'</div>';
  if(D.planta&&PLANTA){
    h+='<h2>Planta de implantação</h2><div class="bar" style="margin-bottom:6px"><button class="chip" data-act="pz" data-d="-1">− Reduzir</button><button class="chip" data-act="pz" data-d="1">+ Ampliar</button><span class="muted" style="align-self:center">'+esc(TX.toque_planta||'Toque na letra da quadra')+'</span></div><div id="plslot" style="margin-bottom:12px"></div>';
  }
  h+='<h2>'+esc(TX.escolha||'Ou escolha a quadra')+'</h2><div class="qgrid">';
  GRUPOS.forEach(function(g){
    var ls=g.lotes,c=0,mc=0;
    ls.forEach(function(k){var cl=contaLote(LOTS[k]).mk;if(cl>0)c++;mc+=cl});
    h+='<button class="qb'+(c===ls.length?' full':'')+'" data-act="quadra" data-q="'+esc(g.id)+'"><b'+(g.rot.length>=5?' class="lw"':'')+'>'+esc(g.rot)+'</b><span>'+(g.nome?'<strong>'+esc(g.nome)+'</strong><br>':'')+ls.length+' '+esc(TX.lotes||'lotes')+' · '+c+' '+esc(TX.vistoriados||'vistoriados')+(mc?'<br>'+mc+' marcas':'')+'</span></button>';
  });
  h+='</div><p class="muted">'+esc(TX.legenda_grade||'Lote vistoriado = tem pelo menos uma marca sua neste mês.')+'</p>';
  return h;
}
function rLotes(){
  topo(GI[ui.quadra]?GI[ui.quadra].tit:qT(ui.quadra),TX.toque_lote||'Toque no lote em que você está',true);
  var h='<div class="lgrid">';
  lotsG(ui.quadra).forEach(function(k){
    var l=LOTS[k],c=contaLote(l),pc=c.tot?Math.round((c.lock+c.mk)*100/c.tot):0;
    var aw=avisosLote(l).length,nu=nomeUnico(l);
    h+='<button class="lb'+(c.mk?' conf':'')+(nu?' nm':'')+'" data-act="lote" data-k="'+k+'">'+(c.mk?'<i class="n">'+c.mk+'</i>':'')+(aw?'<i class="w">⚠</i>':'')+'<b>'+(nu?esc(nu):l.n)+'</b><span>'+pc+'% medido</span></button>';
  });
  h+='</div><div class="card" style="margin-top:12px"><h3>Como ler as cores</h3>'+
    '<div class="leg"><i class="lb conf"></i><span><b>Verde</b> = lote vistoriado: tem pelo menos uma marca sua. O número no canto é a quantidade de marcas.</span></div>'+
    '<div class="leg"><i class="lb"></i><span><b>Branco</b> = nada marcado neste lote ainda.</span></div>'+
    '<div class="leg"><i class="lb pvl"></i><span>Dentro do lote, <b>"Campo N"</b> (amarelo, tracejado) = marcado no app e encerrado, aguardando a medição final N. <b>"Med N"</b> (cinza) = já consta na planilha.</span></div>'+
    '<div class="muted">"% medido" = serviços que a planilha já mostra como medidos em meses anteriores + suas marcas deste mês, sobre o total de serviços do lote. Conta serviços, não valor. Lote sem marcas suas pode ter % medido acima de zero. ⚠ = conferir a planilha (ver dentro do lote).</div></div>';
  return h;
}
function rowHtml(a,ri,li,ln){
  var v=ln.v[li],m=mk(a,ri,li),d='<div class="sd"><b>'+esc(ln.cod)+'</b>'+esc(ln.desc)+'</div>';
  if(v!==null){var pv=ln.pv&&ln.pv[li];return '<div class="srv lk'+(pv?' pv':'')+'">'+d+'<div class="sb">'+(pv?'Campo '+v:(v===0?'já medido':'Med '+v))+'</div></div>'}
  return '<div class="srv '+(m?'mk':'pd')+'" data-act="tog" data-a="'+a+'" data-r="'+ri+'" data-l="'+li+'">'+d+'<div class="sb">'+(m?'✓ Med '+MED():'Marcar')+'</div></div>';
}
function rLote(){
  var l=LOTS[ui.lote];
  topo(nomeUnico(l)?qT(l.q):qT(l.q)+' · '+T_LOTE+' '+l.n,per(),true);
  var h='';
  avisosLote(l).forEach(function(w){h+='<div class="warn">⚠ '+esc(w)+'</div>'});
  h+='<div class="bar"><button class="chip'+(ui.filtro==='todos'?' on':'')+'" data-act="filtro" data-f="todos">Todos</button><button class="chip'+(ui.filtro==='pend'?' on':'')+'" data-act="filtro" data-f="pend">Só pendentes</button><button class="chip'+(ui.filtro==='marc'?' on':'')+'" data-act="filtro" data-f="marc">Marcados agora</button></div>';
  h+='<input class="inp" id="busca" placeholder="Buscar serviço (ex.: radier, pintura)" value="'+esc(ui.busca)+'" style="margin-bottom:10px">';
  var q=norm(ui.busca),algum=false;
  entradas(l).forEach(function(e){
    var ab=D.abas[e.a],corpo='',vistos=0;
    ab.groups.forEach(function(g,gi){
      var out='',lastSub=null,subOk=true,nv=0,np=0,fk=ui.lote+'|'+e.a+'|'+gi;
      for(var ri=g.ri;ri<ab.linhas.length;ri++){
        var ln=ab.linhas[ri];
        if(ri>g.ri&&ln.lvl===1)break;
        if(!ln.folha){if(ri!==g.ri||ln.lvl!==1){lastSub=ln;subOk=false}continue}
        var v=ln.v[e.i],m=mk(e.a,ri,e.i);
        if(v===null&&!m)np++;
        if(ui.filtro==='pend'&&v!==null)continue;
        if(ui.filtro==='marc'&&!m)continue;
        if(q&&norm(ln.cod+' '+ln.desc+' '+g.desc).indexOf(q)<0)continue;
        if(lastSub&&!subOk){out+='<div class="sub">'+esc(lastSub.cod)+' '+esc(lastSub.desc)+'</div>';subOk=true}
        out+=rowHtml(e.a,ri,e.i,ln);nv++;
      }
      if(!nv)return;
      vistos+=nv;
      var fech=!!ui.fechados[fk];
      corpo+='<div class="grp" data-act="grp" data-k="'+fk+'"><span class="tg">'+(fech?'▸':'▾')+'</span><span class="gt">'+esc(g.cod)+' '+esc(g.desc)+'</span><span class="cnt">'+np+' pend.</span>'+(np?'<button class="btn sm g" data-act="bulkg" data-a="'+e.a+'" data-g="'+gi+'" data-l="'+e.i+'">Marcar todos</button>':'')+'</div>';
      if(!fech)corpo+=out;
    });
    if(vistos)algum=true;
    var c=contaEntrada(e.a,e.i);
    h+='<section class="blk"><h3>'+prefAba(ab)+esc(ab.rot)+'<small>aba '+esc(ab.aba)+' · coluna '+ab.lotes[e.i].col+' · '+c.pend+' pendentes, '+c.mk+' marcados agora, '+c.lock+' já medidos</small></h3>'+(corpo||'<p class="muted">Nada para mostrar com este filtro.</p>')+'</section>';
  });
  return h;
}
function rodapeLote(){
  var l=LOTS[ui.lote],c=contaLote(l);
  $('foot').innerHTML='<div class="lbar"><div class="tx"><b>'+c.mk+'</b> marcados agora<br><span class="muted">'+c.pend+' pendentes · '+c.lock+' já medidos</span></div>'+
    '<button class="btn g" data-act="prox">Próximo lote ›</button></div>';
}

function rServicos(){
  topo('Por serviço',cab(),ui.srv!==null);
  var ab=D.abas[ui.aba],h='';
  if(ui.srv===null){
    h+='<div class="bar" style="overflow-x:auto;flex-wrap:nowrap">';
    D.abas.forEach(function(x,i){h+='<button class="chip'+(i===ui.aba?' on':'')+'" data-act="aba" data-i="'+i+'" style="white-space:nowrap">'+esc(x.id)+' '+esc(x.rot)+'</button>'});
    h+='</div><input class="inp" id="sbusca" placeholder="Buscar serviço" value="'+esc(ui.sbusca)+'" style="margin-bottom:10px">';
    var q=norm(ui.sbusca);
    ab.linhas.forEach(function(ln,ri){
      if(!ln.folha)return;
      if(q&&norm(ln.cod+' '+ln.desc+' '+ab.groups[ln.g].desc).indexOf(q)<0)return;
      var np=0,nm=0;
      ln.v.forEach(function(v,li){if(v===null){if(mk(ui.aba,ri,li))nm++;else np++}});

/* ---------- quantidades (preço unitário / percentual) ---------- */
function puEstado(i){var s=st.pu[i];if(!s){s={atual:'',parc:[]};}return s}
/* ---------- canteiro (MC): lista tipo batalha, só células amarelas do MC ---------- */
/* manutenção mensal: o que mediu até a medição anterior ao aditivo não muda; o que falta para a referência
   é dividido por igual entre as medições restantes (da seguinte até a última prevista) */
function cantManut(it){
  var C=D.canteiro,m=MED(),base=(it.ant0!==undefined?it.ant0:it.ant),ref=it.ref,b=C.med_ant,f=C.med_final||(b+1);
  if(m<=b)return base;
  if(m>=f)return ref;
  return base+(ref-base)*(m-b)/(f-b);
}
function cantVal(it){
  if(it.auto)return round(cantManut(it),6);
  var s=st.cant[it.linha];
  if(it.editavel&&s&&String(s.atual||'').trim()!==''){var a=parseNum(s.atual);if(a!==null)return round(a/100,6)}
  return it.ant;
}
function cantErro(it){
  var s=st.cant[it.linha];
  if(!it.editavel||!s||String(s.atual||'').trim()==='')return '';
  var a=parseNum(s.atual);
  if(a===null||a<0||a>100)return 'Informe um percentual de 0 a 100.';
  if(a/100<it.ant-1e-9)return 'Menor que o acumulado anterior ('+fmt(it.ant*100,2)+'%). O MC é acumulado.';
  if(a/100>it.ref+1e-9)return 'Maior que a referência ('+fmt(it.ref*100,2)+'%).';
  return '';
}
function cantCalc(){
  var tot=0,erros=0,mudou=0;
  D.canteiro.grupos.forEach(function(g){g.itens.forEach(function(it){
    var v=cantVal(it);tot+=v;if(cantErro(it))erros++;if(Math.abs(v-it.ant)>1e-9)mudou++;
  })});
  return {total:round(tot,4),erros:erros,mudou:mudou};
}
function puCalc(i){
  var p=D.pu[i],s=puEstado(i),r={ativo:false,mes:0,novo:null,erro:'',avisos:[]};
  if(p.mc){
    if(!st.cantOk)return r;
    var cc=cantCalc();
    r.ativo=true;r.novo=cc.total;r.mes=round(cc.total-p.anterior,4);
    if(cc.erros)r.erro='Há itens do canteiro com valor inválido.';
    return r;
  }
  if(p.pct){
    if(String(s.atual||'').trim()==='')return r;
    var a=parseNum(s.atual);
    if(a===null||a<0||a>100){r.erro='Informe a porcentagem acumulada (0 a 100).';r.ativo=true;return r}
    r.novo=round(a/100,4);r.mes=round(r.novo-p.anterior,4);r.ativo=true;
    if(r.novo<p.anterior)r.avisos.push('Menor que o acumulado anterior ('+fmt(p.anterior*100,2)+'%).');
  }else{
    var soma=0,n=0;
    (s.parc||[]).forEach(function(x){var q=parcQtd(p,x);if(q!==null){soma+=q;n++}});
    if(!n)return r;
    r.ativo=true;r.mes=round(soma,2);r.novo=round(p.anterior+r.mes,2);
    if(r.novo>p.contratual+1e-9)r.avisos.push('Acumulado passa da quantidade contratual ('+fmt(p.contratual,2)+' '+uT(p)+').');
  }
  return r;
}
function parcMetro(p){return p.un==='M'||/^M \(/.test(p.un||'')}
function parcQtd(p,x){
  var c=parseNum(x.c),a=parseNum(x.a);
  if(p.un==='M2'){if(c===null||a===null)return null;return c*a}
  if(c===null)return null;
  return c;
}

var CIT={};

function applyHist(){
  D.abas.forEach(function(ab){ab.linhas.forEach(function(ln){if(!ln.folha)return;if(!ln.v0)ln.v0=ln.v.slice();ln.v=ln.v0.slice();ln.pv=null})});

  Object.keys(CIT).forEach(function(l){var it=CIT[l];if(it.ant0===undefined)it.ant0=it.ant;it.ant=it.ant0});
  /* medições encerradas no app são provisórias ("Campo N") até a base ser atualizada com a medição final */
  st.hist.forEach(function(h){
    Object.keys(h.marks).forEach(function(k){var p=k.split('|'),ln=D.abas[+p[0]].linhas[+p[1]];if(ln&&ln.folha&&ln.v[+p[2]]===null){ln.v[+p[2]]=h.med;(ln.pv=ln.pv||{})[+p[2]]=1}});

  });
}

function marksDe(bat){

  });

function restaurar(txt){
  var ex;try{ex=JSON.parse(txt)}catch(e){return 'Não consegui ler: o conteúdo não é um arquivo válido.'}
  if(!ex||ex.formato!=='medicao-campo'||(ex.versao||1)<2)return 'Esse arquivo não tem histórico (foi gerado por uma versão anterior do app).';
  if(ex.obra&&ex.obra!==D.obra)return 'Esse arquivo é de outra obra ('+ex.obra+').';
  var puIdx={};D.pu.forEach(function(p,i){puIdx[p.aba+'|'+p.cel]=i});
  var novo={marks:{},pu:{},cant:{},cantOk:false,tecnico:ex.tecnico||'',salvoEm:'',med:ex.medicao,hist:[]},perdidos=0;
  (ex.historico||[]).forEach(function(h){
    var r=marksDe(h.batalha),hp={};perdidos+=r.erro;
    Object.keys(h.pu||{}).forEach(function(k){if(puIdx[k]!==undefined)hp[puIdx[k]]=h.pu[k]});
    novo.hist.push({med:h.medicao,marks:r.m,cant:(h.canteiro&&h.canteiro.itens)||{},cantTotal:h.canteiro?h.canteiro.total:null,pu:hp,draft:null});
  });
  var r2=marksDe(ex.batalha);perdidos+=r2.erro;novo.marks=r2.m;
  if(ex.canteiro&&ex.canteiro.itens){
    ex.canteiro.itens.forEach(function(it){if(it.editavel)novo.cant[it.linha_mc]={atual:String(round(it.atual*100,4)).replace('.',','),obs:it.observacao||''}});
    novo.cantOk=true;
  }
  (ex.pu||[]).forEach(function(o){
    var i=puIdx[o.aba+'|'+o.celula];if(i===undefined||D.pu[i].mc)return;
    if(D.pu[i].pct)novo.pu[i]={atual:String(round(o.valor*100,4)).replace('.',','),parc:[]};
    else novo.pu[i]={atual:'',parc:(o.parcelas||[]).map(function(x){return {d:x.local||'',c:String(x.comprimento).replace('.',','),a:x.altura==null?'':String(x.altura).replace('.',',')}})};
  });
  novo.v=3;novo.base=D.sha1;
  var aviso='';
  /* arquivo de outra base (versão anterior do app): mesmas regras da troca de base */
  if(ex.zerada_sha1!==D.sha1){var aj=ajusta(novo,perdidos);novo=aj.st;aviso=' '+aj.texto;perdidos=0}
  return {novo:novo,perdidos:perdidos,aviso:aviso};
}

  st=r.novo;applyHist();save();ui.enviarMsg='';render();toast('Restaurado: medição '+MED()+'.');
}

function compartilhar(){
  var t=enviarTexto(),nome=nomeArq();

  var tentativas=[];
  try{tentativas.push(new File([t],nome,{type:'application/json'}))}catch(e){}
  try{tentativas.push(new File([t],nome,{type:'text/plain'}))}catch(e){}
  (function tenta(i){
    if(i>=tentativas.length){
      return navigator.share({title:nome,text:t}).then(function(){msg('Enviado como texto.')},function(e){if(e&&e.name!=='AbortError')baixar('O compartilhamento foi recusado ('+(e&&e.name)+'). ')});
    }
    var f=tentativas[i];
    if(navigator.canShare&&!navigator.canShare({files:[f]}))return tenta(i+1);
    navigator.share({files:[f],title:nome}).then(function(){msg('Compartilhado.')},function(e){if(e&&e.name==='AbortError')return;tenta(i+1)});
  })(0);
}

    var feito=false;try{feito=document.execCommand('copy')}catch(e){}

}

    var i=+el.getAttribute('data-pu'),f=el.getAttribute('data-f'),s=st.pu[i]=puEstado(i);
    if(f==='atual')s.atual=el.value;
    else{var j=+el.getAttribute('data-j');s.parc[j][f]=el.value}
    save();
    // atualiza só os totais sem perder o foco: rerender preservando o campo
    var ativo={i:i,j:el.getAttribute('data-j'),f:f,pos:el.selectionStart};
    render();
    var sel='[data-pu="'+ativo.i+'"][data-f="'+ativo.f+'"]'+(ativo.j!=null?'[data-j="'+ativo.j+'"]':'');
    var nn=document.querySelector(sel);if(nn){nn.focus();try{nn.setSelectionRange(ativo.pos,ativo.pos)}catch(e){}}
  }
});
MAPA=mapaAtual();
load();
applyHist();
render();
if(ui.avisoBase)toast(ui.avisoBase);
window.__app={D:D,st:function(){return st},LOTS:LOTS,montaExport:montaExport,encerrar:encerrar,save:save};
})();
</script>
